name: Maxbo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The version, as in app/build.gradle.kts.
    MARKETING_VERSION: "0.13.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Maxbo:
    type: application
    platform: iOS
    sources:
      - Maxbo
      # Shown on the licences page.
      - path: ../LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.maxbo
        PRODUCT_NAME: Maxbo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: maxbo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # One window: the router, toasts and timeline are app-wide.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.maxbo.debug
          INFOPLIST_KEY_CFBundleDisplayName: maxbo debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  MaxboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MaxboTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.maxbo.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Maxbo
  MaxboUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MaxboUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.maxbo.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Maxbo
schemes:
  Maxbo:
    build:
      targets:
        Maxbo: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MaxboTests]
    archive:
      config: Release
  # Drives the app on a simulator with no real login; see docs/IOS.md §5.
  MaxboUI:
    build:
      targets:
        Maxbo: all
    test:
      config: Debug
      targets: [MaxboUITests]
