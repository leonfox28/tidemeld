name: Tidemeld
options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The version, as in app/build.gradle.kts.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "8"
targets:
  Tidemeld:
    type: application
    platform: iOS
    sources:
      - path: ../protocol/x-web.json
        buildPhase: resources
      - Tidemeld
      # Shown on the licences page.
      - path: ../LICENSE
        buildPhase: resources
      - path: ../docs/PRIVACY.md
        buildPhase: resources
    settings:
      base:
        # The App Store record is recreated under the Tidemeld identity.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.tidemeld
        PRODUCT_NAME: Tidemeld
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # What the keys below can't say; merged with them.
        INFOPLIST_FILE: Tidemeld/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 叠澜
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # One window: the router, toasts and timeline are app-wide.
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # Keep existing development installs and their local sign-in sessions.
          PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.maxbo.debug
          INFOPLIST_KEY_CFBundleDisplayName: 叠澜 Debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  TidemeldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TidemeldTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.tidemeld.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tidemeld
  TidemeldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TidemeldUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.tidemeld.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tidemeld
schemes:
  Tidemeld:
    build:
      targets:
        Tidemeld: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [TidemeldTests]
    archive:
      config: Release
  # Drives the app on a simulator with no real login; see docs/IOS.md §5.
  TidemeldUI:
    build:
      targets:
        Tidemeld: all
    test:
      config: Debug
      targets: [TidemeldUITests]
